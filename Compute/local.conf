# +++++++++++++++++++++++++++++++++
# ++++ Local compute · CONF(1) ++++
# +++++++++++++++++++++++++++++++++

[[local|localrc]]

# ++++++++++++++++++++
# CONFIGURATION RESEAU
# ++++++++++++++++++++
HOSTNAME=compute
HOST_IP=172.20.10.6
SERVICE_HOST=172.20.10.5

# Interface de données pour OVS
PUBLIC_INTERFACE=ens34
FLAT_INTERFACE=ens34
PUBLIC_NETWORK_GATEWAY=172.20.10.1
DNS_SERVERS=8.8.8.8,1.1.1.1

# +++++++++++++++++++++++++++
# AUTHENTIFICATION & SECURITE
# +++++++++++++++++++++++++++
ADMIN_PASSWORD=password
DATABASE_PASSWORD=password
RABBIT_PASSWORD=password
SERVICE_PASSWORD=password

# --- Lignes à ajouter pour un cloud propre ---
KEYSTONE_CREATE_TEST_USERS=False
DOWNLOAD_DEFAULT_IMAGES=False
disable_service tempest

# +++++++++++++++++++++++++++++++
# CONNEXION AUX SERVICES CENTRAUX
# +++++++++++++++++++++++++++++++
MYSQL_HOST=$SERVICE_HOST
RABBIT_HOST=$SERVICE_HOST
GLANCE_HOSTPORT=$SERVICE_HOST:9292
Q_HOST=$SERVICE_HOST

KEYSTONE_AUTH_HOST=$SERVICE_HOST
KEYSTONE_SERVICE_HOST=$SERVICE_HOST
KEYSTONE_TOKEN_FORMAT=fernet

# +++++++++++
# MULTI-NOEUD
# +++++++++++
MULTI_HOST=1

# ++++++++++++++
# NOVA - COMPUTE
# ++++++++++++++
ENABLED_SERVICES=n-cpu
LIBVIRT_TYPE=kvm
NOVA_INSTANCES_PATH=/opt/stack/data/nova/instances

# Attente des services centraux
WAIT_FOR_RABBIT=60
WAIT_FOR_MYSQL=60

# +++++++++++++++++
# VNC Configuration
# +++++++++++++++++
NOVA_VNC_ENABLED=True
NOVNCPROXY_URL="http://172.20.10.5:6080/vnc_lite.html"
VNCSERVER_LISTEN=172.20.10.6
VNCSERVER_PROXYCLIENT_ADDRESS=172.20.10.6

# ++++++++++++++++++++++++++++++
# NEUTRON - Agent OVS uniquement
# ++++++++++++++++++++++++++++++
enable_plugin neutron https://opendev.org/openstack/neutron
ENABLED_SERVICES+=,neutron,q-agt

Q_AGENT=openvswitch
Q_ML2_PLUGIN_TENANT_NETWORK_TYPES=vxlan,geneve
Q_ML2_PLUGIN_MECHANISM_DRIVERS=openvswitch,l2population
Q_ML2_PLUGIN_TYPE_DRIVERS=flat,vlan,vxlan,geneve
Q_ML2_PLUGIN_EXT_DRIVERS=port_security
Q_ML2_PLUGIN_VNI_RANGES=1:1000

# +++++++++++++++++++
# SERVICES DESACTIVES
# +++++++++++++++++++
disable_service rabbit mysql key horizon
disable_service g-api
disable_service n-api n-crt n-cond n-sch n-api-meta n-novnc
disable_service placement-api placement-client
disable_service cinder c-api c-vol c-sch c-bak
disable_service swift s-proxy s-object s-container s-account
disable_service heat h-eng h-api h-api-cfn
disable_service barbican barbican-api barbican-worker barbican-keystone-listener
disable_service designate designate-central designate-api designate-worker designate-producer designate-mdns
disable_service tempest etcd3

# ++++
# LOGS
# ++++
DEBUG=True
VERBOSE=True
DEST=/opt/stack
LOGFILE=$DEST/logs/stack.sh.log
SCREEN_LOGDIR=$DEST/logs
SYSLOG=False
LOG_COLOR=True
LOGDAYS=7

# +++++++++++
# POST-CONFIG
# +++++++++++

[[post-config|/etc/neutron/plugins/ml2/ml2_conf.ini]]
[ml2]
type_drivers = flat,vlan,vxlan,geneve
tenant_network_types = vxlan,geneve
mechanism_drivers = openvswitch,l2population
extension_drivers = port_security

[ml2_type_flat]
flat_networks = public

[ml2_type_vxlan]
vni_ranges = 1:1000

[ovs]
bridge_mappings = public:br-ex
local_ip = 172.20.10.6
datapath_type = system

[agent]
tunnel_types = vxlan
l2_population = True
drop_flows_on_start = False

[securitygroup]
firewall_driver = neutron.agent.linux.iptables_firewall.OVSHybridIptablesFirewallDriver

[[post-config|$NOVA_CONF]]
[DEFAULT]
compute_driver = libvirt.LibvirtDriver
vif_plugging_is_fatal = False
vif_plugging_timeout = 300

[vnc]
enabled = True
server_listen = 0.0.0.0
server_proxyclient_address = 172.20.10.6
novncproxy_base_url = http://172.20.10.5:6080/vnc_lite.html

[libvirt]
virt_type = kvm
cpu_mode = host-passthrough
disk_cachemodes = network=writeback

[neutron]
auth_url = http://172.20.10.5:5000
auth_type = password
project_domain_name = Default
user_domain_name = Default
region_name = RegionOne
project_name = service
username = neutron
password = password

[placement]
auth_url = http://172.20.10.5:5000
auth_type = password
project_domain_name = Default
user_domain_name = Default
region_name = RegionOne
project_name = service
username = placement
password = password
