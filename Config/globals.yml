# +++ /etc/kolla/globals.yml ++++

# +++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++
# /etc/kolla/globals.yml — Kolla-Ansible — OpenStack 2024.2 (Dalmatian)
# +++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++
 
# ++++++++++++++++++++++
# Configuration générale
# ++++++++++++++++++++++
workaround_ansible_issue_8743: yes
 
# COPY_ALWAYS : les configs sont régénérées à chaque "deploy"/"reconfigure".
# Bon choix en prod : évite la dérive de configuration ("config drift").
config_strategy: "COPY_ALWAYS"

# Distribution et release 
kolla_base_distro: "rocky"
openstack_release: "2024.2"
network_address_family: "ipv4"
kolla_container_engine: docker

docker_configure_for_zun: "yes"
containerd_configure_for_zun: "yes"
 
# Docker (Rocky Linux)
docker_yum_package_pin: "3:28.*"
docker_registry: "docker.io"
docker_namespace: "kolla"
 
# ++++++++++++++++++++
# Configuration réseau
# ++++++++++++++++++++
network_interface: "ens160"
neutron_external_interface: "ens192"
kolla_internal_vip_address: "172.20.10.14"
 
# +++++++++++++
# Plugin réseau
# +++++++++++++
neutron_plugin_agent: "openvswitch"
enable_kuryr: "yes"

# Désactiver Infoblox IPAM (non utilisé)
enable_neutron_infoblox_ipam_agent: "no"

# Désactiver VPNaas (non utilisé)
enable_neutron_vpnaas: "no"
 
# +++++++++++++++++++++++
# Services cœur OpenStack
# +++++++++++++++++++++++
enable_openstack_core: "yes"
enable_keystone: "{{ enable_openstack_core | bool }}"
enable_glance: "{{ enable_openstack_core | bool }}"
enable_nova: "{{ enable_openstack_core | bool }}"
enable_neutron: "{{ enable_openstack_core | bool }}"
enable_heat: "{{ enable_openstack_core | bool }}"
enable_horizon: "{{ enable_openstack_core | bool }}"
 
# +++++++++++++++++++
# Haute disponibilité
# +++++++++++++++++++
enable_haproxy: "yes"
enable_keepalived: "{{ enable_haproxy | bool }}"
 
# +++++++++++++++++++++++++++++++++++++++++++
# Sécurité / TLS [AJOUT — recommandé en prod]
# +++++++++++++++++++++++++++++++++++++++++++
# Sans TLS, tout le trafic API et inter-services circule en clair.
# Activez ces options une fois vos certificats générés/fournis
# (auto-signés via kolla-ansible certificates, ou une CA interne) :
kolla_enable_tls_internal: "yes"
kolla_enable_tls_external: "yes"
kolla_copy_ca_into_containers: "yes"
kolla_verify_tls_backend: "yes"

# FQDN fictif (tu n'as pas de domaine réel)
kolla_external_fqdn: "openstack.tubie.lan"
kolla_external_vip_address: "172.20.10.14"
 
# ++++++++++++++++++++++++++++
# Base de données & messagerie
# ++++++++++++++++++++++++++++
enable_mariadb: "yes"
enable_memcached: "yes"
enable_etcd: "yes"
 
# ++++++++++++++++++++++++
# Télémétrie & supervision
# ++++++++++++++++++++++++
enable_ceilometer: "yes"
enable_aodh: "yes"
enable_gnocchi: "yes"
enable_gnocchi_statsd: "yes"
enable_prometheus: "yes"
enable_grafana: "yes"
 
# [AJOUT] Par défaut Gnocchi utilise un backend "file" (stockage local
# au conteneur, /var/lib/gnocchi). En multi-contrôleurs (HA), cela
# provoque des métriques incohérentes selon le nœud interrogé.
# Si vous déployez Ceph, basculez sur "ceph" ; sinon gardez "file"
# uniquement en mono-contrôleur / lab.
gnocchi_backend_storage: "file"
 
# ++++++++++++++++++++++
# Stockage bloc (Cinder)
# ++++++++++++++++++++++
enable_cinder: "yes"
enable_cinder_backend_lvm: "yes"
cinder_volume_group: "cinder-volumes"
cinder_enabled_backends: "lvm"
 
# Sauvegarde des volumes — désactivée explicitement par défaut.
# À activer en prod avec un backend NFS ou Swift dédié :
enable_cinder_backup: "yes"
cinder_backup_driver: "swift"

 
# ++++++++++++++++++++++++++++++++++++++++
# Services applicatifs conteneurisés (Zun)
# ++++++++++++++++++++++++++++++++++++++++
enable_zun: "yes"
enable_horizon_zun: "{{ enable_zun | bool }}"

# ++++++++++++++++++++++++++++++
# Gestion des secrets (Barbican)
# ++++++++++++++++++++++++++++++
enable_barbican: "yes"

# ++++++++++++++++++++++++++++
# Clusters Kubernetes (Magnum)
# ++++++++++++++++++++++++++++
enable_magnum: "yes"

# ++++++++++++++++++++++
# Stockage objet (Swift)
# ++++++++++++++++++++++
enable_swift: "yes"

# +++++++++++++++
# DNS (Designate)
# +++++++++++++++
enable_designate: "yes"
enable_designate_backend_bind9: "yes"
designate_backend: "bind9"
neutron_dns_domain: "tubie.ops."

# Valkey (obligatoire pour Octavia en 2024.2)
enable_valkey: "yes"

# ++++++++++++++++++++++++++++++++++++
# Octavia (Load Balancer as a Service)
# +++++++++++++++++++++++++++++++++++
enable_octavia: "yes"
enable_octavia_health_manager: "yes"
enable_octavia_housekeeping: "yes"
enable_octavia_worker: "yes"
enable_octavia_driver_agent: "yes"

# Configuration basique Octavia (recommandée)
octavia_amp_flavor_id: "auto"
octavia_amp_image_tag: "current"
octavia_amp_network: "lb-mgmt-net"
octavia_amp_subnet: "lb-mgmt-subnet"
octavia_amp_boot_network_list: "{{ kolla_internal_vip_address }}/28"
 
# +++++++++++++++++++++++++
# Service d'images (Glance)
# +++++++++++++++++++++++++
glance_backend_file: "yes"
glance_file_datadir_volume: "/mnt/glance"

# IMPORTANT en HA multi-contrôleurs : /mnt/glance DOIT être un point de
# montage PARTAGÉ et IDENTIQUE sur tous les nœuds contrôleurs (NFS,
# CephFS, GlusterFS...). Un simple répertoire local par nœud provoquera
# des images invisibles/corrompues selon le contrôleur qui répond.
# Alternative recommandée en prod si Ceph est disponible :
# glance_backend_file: "no"
# glance_backend_ceph: "yes"
